name: Mirror docs to EpicFight-Docs

on:
  push:
    paths:
      - "docs/**"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        # Automatically checks out the current branch

      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_MIRROR_TOKEN }}@github.com/Epic-Fight/EpicFight-Docs.git target

      - name: Sync docs into versioned folder
        run: |
          # Create a specific directory for THIS branch/version
          # target/docs/API/1.21.1 or target/docs/API/main
          mkdir -p target/docs/API/${{ github.ref_name }}
          
          # Sync files into that specific subfolder
          rsync -av --delete docs/ target/docs/API/${{ github.ref_name }}/

      - name: Commit and push changes
        run: |
          cd target
          git config user.name "EpicFight Docs Bot"
          git config user.email "docs-bot@users.noreply.github.com"
          
          # Add only the specific version folder changed
          git add docs/API/${{ github.ref_name }}
          
          git commit -m "Sync API docs for version ${{ github.ref_name }}" || echo "No changes"
          git push
