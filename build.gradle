plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    
    runs {
    	
    	configureEach {
    		property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
			property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
			args '-mixin.config=mixins.epicfight.json'
			
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
    	}

        client {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id
            //jvmArgs '-Dorg.lwjgl.opengl.libname=\'C:\\Program Files\\RenderDoc\\renderdoc.dll\''
            //args '-Dorg.lwjgl.opengl.libname=renderdoc.dll'

        }

        server {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id
        }
		
        gameTestServer {
            workingDirectory project.file('run')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    flatDir {
        dir 'libs'
    }

    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'

        content {
            includeGroup 'net.minecraftforge'
        }
    }

    exclusiveContent {
        forRepository { maven { url "https://cursemaven.com" } }
        forRepositories(fg.repository)
        filter { includeGroup "curse.maven" }
    }

    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        forRepositories(fg.repository)
        filter { includeGroup "maven.modrinth" }
    }
    
    maven {
    	// location of the maven that hosts JEI files since January 2023
    	name = "Jared's maven"
   		url = "https://maven.blamejared.com/"
  	}

    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }

    maven {
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
}

mixin {
    add sourceSets.main, "mixins.epicfight.refmap.json"
    config 'mixins.epicfight.json'
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	
	// Copy and paste dependencies you need at the below
	// JEI compatibility (optional)
  	compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
 	compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
  	runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
	
	// Azurelib, Azurelib armor, Geckolib compatibility (optional)
    compileOnly fg.deobf("curse.maven:azurelib-817423:5500355")
    compileOnly fg.deobf("curse.maven:azurelib-armor-912767:5500370")
    compileOnly fg.deobf("curse.maven:geckolib-388172:5675221")
	
	// Iris, Sodium compatibility, compute shader compat (optional)
    compileOnly fg.deobf("curse.maven:embeddium-908741:5556138")
    compileOnly fg.deobf("curse.maven:oculus-581495:5299671")
    
    // Werewolves, Vampirism compatibility, baking layer model for vampire and visibility fix when transform to the wolf (optional)
    compileOnly fg.deobf("curse.maven:werewolves-become-a-beast-417851:5406832")
    compileOnly fg.deobf("curse.maven:vampirism-become-a-vampire-233029:5743414")
    
    // Curios compatibility, baking curio models from curio slots (optional)
    compileOnly fg.deobf("curse.maven:curios-309927:6216710")
    
    // Ice-and-fire dependency, dragon mount render fix (optional)
    compileOnly fg.deobf("curse.maven:citadel-331936:5559513")
    compileOnly fg.deobf("curse.maven:ice-and-fire-dragons-264231:5633453")
    
    // Player animator compatibility, emote fix (optional)
    compileOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
    
    // Libraries for tr7zw featured mods (optional, when you dependent your project on 3D Skin Layers or First-person)
    compileOnly fg.deobf("libs:TRansition:1.0.5")
    compileOnly fg.deobf("libs:TRender:1.0.7")
    
    // Skinlayer3d compatibility (optional)
    compileOnly fg.deobf("maven.modrinth:3dskinlayers:BBnR3V86") // 1.9.2
    // First-person compatibility (optional)
    compileOnly fg.deobf("maven.modrinth:first-person-model:ub6wk879") // 2.5.0
    
    // KubeJS compatibility (optional)
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    compileOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Create source.jar
java {
    withSourcesJar()
}
